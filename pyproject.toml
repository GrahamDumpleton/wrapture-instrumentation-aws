[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapture-instrumentation-aws"
dynamic = ["version"]
description = "Instrumentation for the AWS SDK (boto3 and botocore), applied through wrapture."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Graham Dumpleton", email = "Graham.Dumpleton@gmail.com"}
]
requires-python = ">=3.12"
keywords = ["wrapture", "instrumentation", "aws", "boto3", "botocore", "tracing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
# wrapture is the only dependency, ever. An instrumentation package
# never depends on the packages it instruments: installing it must not
# install boto3, and whether botocore is present and at a supported
# version is checked by wrapture at apply time from the class data. The
# floor is the release carrying per-operation resolvers (label=,
# category= and data= as callables), which the botocore seam declares.
dependencies = [
    "wrapture>=1.0.0a21",
]

[project.urls]
Homepage = "https://github.com/GrahamDumpleton/wrapture-instrumentation-aws"
Documentation = "https://wrapture.readthedocs.io"
"Bug Tracker" = "https://github.com/GrahamDumpleton/wrapture-instrumentation-aws/issues/"

# One entry per target, the entry point name being the bare target
# name the config's [[instrument]] entry uses. The group name has a
# dot in it, hence the quoted header.
[project.entry-points."wrapture.instrumentation"]
botocore = "wrapture_instrumentation_aws.botocore:BotocoreInstrumentation"

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
wrapture_instrumentation_aws = ["py.typed", "*/README.md"]

[tool.setuptools.dynamic]
version = {attr = "wrapture_instrumentation_aws.__version__"}

[dependency-groups]
# The test group carries boto3 (which drags the matching botocore),
# moto for the in-memory AWS backend, and the core wrapture
# instrumentation package for the urllib3 target the composition tests
# compose against. moto's extras pull the backends the suite exercises
# (and PyYAML for the s3 backend, and Flask and werkzeug for the
# threaded server). moto needs cryptography, which has no free
# threaded wheel for 3.13 or 3.15 yet, so those builds are left out of
# the matrix rather than run with nothing installed; the suite also
# skips itself where the import fails.
test = [
    "boto3",
    "moto[s3,dynamodb,sqs,sns,server]",
    "pytest",
    "wrapture-instrumentation",
]
dev = [
    {include-group = "test"},
    "mypy",
    "ruff",
    "setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wrapture_instrumentation_aws", "tests", "demo"]

# boto3, botocore and moto ship no type information wrapture's strict
# checking can use; they cross this package through Any-typed hook
# modules and test helpers anyway.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# moto ships a py.typed marker but re-exports its server helpers
# implicitly, which strict mode's no-implicit-reexport rejects; the
# tests use it as untyped scaffolding, so skip following it.
[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["wrapture_instrumentation_aws"]

# The botocore suites guard their imports behind importorskip, so
# their module-level imports legitimately follow that statement.
[tool.ruff.lint.per-file-ignores]
"tests/botocore/*" = ["E402"]
